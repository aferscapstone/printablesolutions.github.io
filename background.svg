<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Metallic Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <!-- Slightly Darker White / Soft Pearl-Gray Background Gradient -->
    <linearGradient id="homeSoftBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Soft Darker White Background Fill -->
  <rect width="1440" height="900" fill="url(#homeSoftBg)"/>

  <!-- Bottom Right Paths -->
  <path d="M 0,900 L 1440,900 L 1440,400 Q 1000,850 0,900 Z" fill="#1e293b"/>
  <path d="M 0,880 Q 980,820 1440,320 L 1440,410 Q 1000,860 0,900 Z" fill="url(#goldGradient)"/>
</svg>
