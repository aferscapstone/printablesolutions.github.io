<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Background Gradient: Seamlessly matches section bg at top/bottom, deep navy in middle -->
    <linearGradient id="topBottomFadeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="12%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#111827"/>
      <stop offset="75%" stop-color="#111827"/>
      <stop offset="88%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Metallic Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Soft Glow for Header Area -->
    <radialGradient id="topGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Background with Top & Bottom Symmetry -->
  <rect width="1440" height="800" fill="url(#topBottomFadeBg)"/>

  <!-- Ambient Light Glow Behind Header -->
  <rect width="1440" height="800" fill="url(#topGlow)"/>

  <!-- TOP FLUID ORGANIC WAVE -->
  <path d="M 0,120 C 400,200 900,40 1440,160 L 1440,650 C 900,750 400,600 0,680 Z" fill="#111827" opacity="0.9"/>

  <!-- DYNAMIC GOLD ACCENT RIBBON (Top) -->
  <path d="M 0,110 C 400,190 900,30 1440,150" stroke="url(#goldGradient)" stroke-width="3" fill="none"/>

  <!-- DYNAMIC GOLD ACCENT RIBBON (Bottom mirror curve matching the exit fade) -->
  <path d="M 0,690 C 400,610 900,760 1440,640" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6" fill="none"/>

  <!-- GEOMETRIC TECH MESH ACCENTS -->
  <g stroke="url(#goldGradient)" stroke-width="1" opacity="0.2" fill="none">
    <line x1="100" y1="350" x2="300" y2="550"/>
    <line x1="150" y1="350" x2="350" y2="550"/>
    <line x1="1140" y1="400" x2="1340" y2="600"/>
    <line x1="1190" y1="400" x2="1390" y2="600"/>
  </g>

  <!-- SUBTLE ACCENT DIAMONDS -->
  <g fill="url(#goldGradient)" opacity="0.4">
    <polygon points="220,450 230,460 220,470 210,460"/>
    <polygon points="1250,500 1260,510 1250,520 1240,510"/>
  </g>
</svg>
